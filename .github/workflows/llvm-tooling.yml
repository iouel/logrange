# The correctness gates for the LLVM tooling, which until recently only
# ever ran when a human typed them into WSL:
#
#   matcher/run_study.sh selftest   labeled ground truth for the matcher
#   matcher/run_study.sh coverage   the coverage claims in matcher/RESULTS.md
#   pass/run_pass_test.sh           the rewrite prototype, end to end
#   matcher/test_scan.sh            the diagnostic front door, end to end
#   matcher/run_study.sh figures    published figures, from committed evidence
#   matcher/run_study.sh delta      DELTA.md's figures, likewise
#
# Deliberately a SEPARATE workflow from tests.yml. This job installs a
# toolchain from a third-party apt mirror; the header-only library's signal
# must not go red because apt.llvm.org had a bad day. It is also slower than
# the library matrix, and that is an acceptable trade here.
#
# LLVM 21 is installed explicitly and pinned by major version: both plugins are
# built against LLVM 21, pass/run_pass_test.sh hardcodes CMAKE_PREFIX_PATH=
# /usr/lib/llvm-21 and calls opt-21 by name, and a plugin loaded into an opt of
# a different major version will not load at all. Nothing here relies on
# whatever LLVM the runner image happens to ship.
name: llvm-tooling
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: llvm-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: llvm-21-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -e -o pipefail, so a failing gate survives `| tee`
    env:
      LLVM_VERSION: "21"
      # matcher/run_study.sh honours OPT and CLANG (defaulting to the
      # unversioned names) and runs cmake without a prefix of its own, so the
      # LLVM it finds is entirely the environment's business.
      CMAKE_PREFIX_PATH: /usr/lib/llvm-21
      OPT: opt-21
      CLANG: clang-21
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM ${{ env.LLVM_VERSION }} from apt.llvm.org
        run: |
          set -euxo pipefail
          . /etc/os-release
          CODENAME="${VERSION_CODENAME}"
          # Fail loudly rather than silently installing packages built for a
          # different Ubuntu: a wrong-codename toolchain fails much later and
          # much more confusingly than a missing repo.
          if ! curl -fsI "https://apt.llvm.org/${CODENAME}/dists/llvm-toolchain-${CODENAME}-${LLVM_VERSION}/Release" > /dev/null; then
            echo "apt.llvm.org has no llvm-toolchain-${CODENAME}-${LLVM_VERSION} channel."
            echo "The runner image moved to '${CODENAME}' before LLVM published for it;"
            echo "pin runs-on to an older ubuntu-XX.XX, or bump LLVM_VERSION."
            exit 1
          fi
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            zlib1g-dev libzstd-dev

      # pass/run_pass_test.sh calls plain `clang` (only `opt` is version-suffixed
      # there), so the unversioned name has to resolve to 21 as well — otherwise
      # the runner's stock clang emits the IR and opt-21 consumes it, which is a
      # version skew nobody asked for.
      - name: Put LLVM ${{ env.LLVM_VERSION }} first on PATH
        run: echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions (assert the pin actually took)
        run: |
          set -euo pipefail
          clang --version
          opt --version
          opt-21 --version
          for tool in clang opt opt-21; do
            "$tool" --version | grep -qE "version ${LLVM_VERSION}\." \
              || { echo "FAIL: $tool is not LLVM ${LLVM_VERSION}"; exit 1; }
          done
          test -f "/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm/LLVMConfig.cmake"

      # Gate 1. run_study.sh resolves its own paths from $0, but it is written
      # to be run from matcher/, so run it from there. It builds the plugin
      # itself (build_plugin -> matcher/build, which is gitignored, so this is
      # always a cold build).
      - name: Gate 1 — matcher selftest (labeled ground truth)
        working-directory: matcher
        run: |
          bash ./run_study.sh selftest | tee "$RUNNER_TEMP/selftest.out"
          grep -q '^SELFTEST PASS' "$RUNNER_TEMP/selftest.out" \
            || { echo "FAIL: no SELFTEST PASS line"; exit 1; }

      # Gate 2. Guards matcher/RESULTS.md's coverage table in both directions —
      # named shapes that must hit, and documented gaps that must still miss.
      - name: Gate 2 — matcher coverage (RESULTS.md coverage claims)
        working-directory: matcher
        run: |
          bash ./run_study.sh coverage | tee "$RUNNER_TEMP/coverage.out"
          grep -q '^COVERAGE PASS' "$RUNNER_TEMP/coverage.out" \
            || { echo "FAIL: no COVERAGE PASS line"; exit 1; }

      # Gate 3. Builds the rewrite plugin, rewrites the softmax kernel, links
      # straight and rewritten kernels into one binary and compares them. Runs
      # from the repo root; the script sets its own CMAKE_PREFIX_PATH and works
      # under $HOME/logrange-pass.
      - name: Gate 3 — rewrite pass prototype, end to end
        run: |
          bash pass/run_pass_test.sh | tee "$RUNNER_TEMP/pass.out"
          grep -q '^run_pass_test: PASS$' "$RUNNER_TEMP/pass.out" \
            || { echo "FAIL: no run_pass_test: PASS line"; exit 1; }

      # Gate 4. The front door: build directory in, report out. Twelve cases,
      # including the ones that keep a partial scan from reading as a clean
      # one. Runs from the repo root because case 12 configures this
      # repository with cmake and scans it, the worked example in SETUP.md.
      - name: Gate 4 — diagnostic front door (logrange-scan.sh)
        run: |
          bash matcher/test_scan.sh | tee "$RUNNER_TEMP/scan.out"
          grep -q '^test_scan: PASS' "$RUNNER_TEMP/scan.out" \
            || { echo "FAIL: no test_scan: PASS line"; exit 1; }

      # Gate 5. Every published corpus figure, derived from the COMMITTED
      # matcher/data/raw-*.txt rather than asserted in prose. Needs no corpus
      # checkout, no bitcode harvest and no plugin build, which is exactly why
      # it can run here — the figures were previously reproducible only on a
      # machine with the corpus, and reached the docs by hand. One of them was
      # wrong (a mis-stated denominator) and survived review.
      - name: Gate 5 — published figures derived from committed evidence
        run: |
          bash matcher/run_study.sh figures | tee "$RUNNER_TEMP/figures.out"
          grep -q '^FIGURES OK' "$RUNNER_TEMP/figures.out" \
            || { echo "FAIL: no FIGURES OK line"; exit 1; }

      # Gate 6. matcher/DELTA.md's figures, derived from the committed
      # matcher/data/raw-delta.txt. That measurement cannot be re-run — it
      # needed both recognizers in one binary, and the hand-written one was
      # deleted once the comparison was published — so its paired output is
      # committed instead and recomputed here. Same no-corpus contract as
      # Gate 5. Also asserts the claim the whole swap rests on: recognition
      # changed and no risk grade did.
      - name: Gate 6 — recognizer delta derived from committed evidence
        run: |
          bash matcher/run_study.sh delta | tee "$RUNNER_TEMP/delta.out"
          grep -q '^DELTA OK' "$RUNNER_TEMP/delta.out" \
            || { echo "FAIL: no DELTA OK line"; exit 1; }

      # Gate 7. CONTRIBUTING.md, "Where a sentence goes": the intent doc
      # states what must be true, not what happened. It had accreted a 94-line
      # work log indexing records that live in six other files, and one of its
      # hand-copied figures sat two revisions stale while CI gated the same
      # number elsewhere. A rule with no gate is what already failed here, so
      # this is the gate. Dates, SHAs and counts belong in CHANGELOG.md,
      # TODO.md, or the measurement docs.
      # Gate 8. The cross-loop census, derived from committed evidence. The
      # signal was measured and DECLINED as a risk promotion (matcher/XLOOP.md),
      # so what this protects is the negative result: the census must keep
      # returning the number the decision rests on, and the HIT stream must
      # stay byte-identical to data/raw-*.txt so "no figure moved" stays true.
      - name: Gate 8 — cross-loop census derived from committed evidence
        run: |
          f=matcher/data/raw-xloop.txt
          test -f "$f" || { echo "FAIL: missing committed evidence $f"; exit 1; }
          loops=$(grep -c '^LOOP,' "$f" || true)
          hits=$(grep -c '^HIT,' "$f" || true)
          xl=$(grep -c '^XLOOP,' "$f" || true)
          xhigh=$(grep -c '^XLOOP,.*,HIGH$' "$f" || true)
          echo "loops=$loops hits=$hits cross-loop=$xl high=$xhigh"
          [ "$loops/$hits/$xl" = "2859/814/231" ] || {
            echo "FAIL: derived $loops/$hits/$xl, XLOOP.md publishes 2859/814/231"; exit 1; }
          # The declined-promotion argument rests on none of them being HIGH.
          [ "$xhigh" = "0" ] || { echo "FAIL: a cross-loop hit is graded HIGH"; exit 1; }
          # The census must not have leaked into the graded stream.
          grep -q 'cross-loop' matcher/data/raw-gsl.txt && {
            echo "FAIL: cross-loop leaked into the HIT stream"; exit 1; }
          echo "XLOOP FIGURES OK"

      - name: Gate 7 — intent doc carries no status content
        run: |
          f=logrange_intent.md
          fail=0
          check() {  # <name> <ere>
            if grep -nEi "$2" "$f"; then
              echo "FAIL: $f contains $1 — see CONTRIBUTING.md, 'Where a sentence goes'"
              fail=1
            fi
          }
          check "a date"       '(^|[^0-9])(19|20)[0-9]{2}-[0-9]{2}-[0-9]{2}([^0-9]|$)'
          check "a commit SHA" '(^|[^0-9a-z])[0-9a-f]{7,40}([^0-9a-z]|$)'
          # NOT "any number". The intent doc legitimately carries domain
          # constants (|log| ~ 700, terms near -800, ~745 log-units below the
          # reference) and spec quantities (a 1000-term mixture). Those are
          # what must be true. What must not appear is a MEASURED RESULT, and
          # the tell is a number next to study vocabulary — this pattern
          # matches every figure line in the version of this file that carried
          # a two-revisions-stale hit count, and nothing in the current one.
          check "a measured figure" '[0-9][0-9.,]*[[:space:]]*(%|hits?|loops?|sites?|modules?|rows?)\b|\b(hits?|loops?|sites?|rows?)[[:space:]]+[0-9]'
          exit $fail

      # The raw matcher output is the evidence behind the two matcher gates;
      # keep it so a red run can be read without re-running anything locally.
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-tooling-gate-output
          path: |
            ${{ runner.temp }}/selftest.out
            ${{ runner.temp }}/coverage.out
            ${{ runner.temp }}/pass.out
            ${{ runner.temp }}/scan.out
            ${{ runner.temp }}/figures.out
            ~/logrange-study/raw-selftest.txt
            ~/logrange-study/raw-coverage.txt
            ~/logrange-pass/rewrite.log
            ~/logrange-pass/test.out
          if-no-files-found: warn
